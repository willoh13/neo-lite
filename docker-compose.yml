# ──────────────────────────────────────────────────────────────────────────
# NEO Lite — Docker Compose
# ──────────────────────────────────────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and set your DEEPSEEK_API_KEY
#   2. docker compose up -d
#   3. Open http://localhost:8080 to chat with your NEO
# ──────────────────────────────────────────────────────────────────────────

services:
  neo-lite:
    build: .
    container_name: neo-lite
    ports:
      - "8080:8080"
    volumes:
      # Persist your data (memory, SOUL.md, config) across restarts
      - neo-lite-data:/root/.hermes
      # Mount your .env file
      - ./.env:/root/.hermes/.env:ro
      # Mount parts directory for add-on skill packs
      - ./parts:/opt/hermes/parts:ro
    environment:
      - HERMES_HOME=/root/.hermes
      - TERM=xterm-256color
      # Pass license key from .env
      - NEO_LICENSE_KEY=${NEO_LICENSE_KEY}
      - NEO_DAILY_LIMIT=${NEO_DAILY_LIMIT:-5}
    restart: unless-stopped
    # Free-tier limit: 1GB RAM, 0.5 CPU
    mem_limit: 1g
    cpus: 0.5

volumes:
  neo-lite-data:
