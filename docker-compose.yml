# ──────────────────────────────────────────────────────────────────────────
# NEO Lite — Docker Compose
# ──────────────────────────────────────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and set your DEEPSEEK_API_KEY
#   2. docker compose up -d
#   3. Open http://localhost:8080 to chat with your NEO
# ──────────────────────────────────────────────────────────────────────────

services:
  neo-lite:
    build: .
    container_name: neo-lite
    ports:
      - "8080:8080"
    volumes:
      # Persist your data (memory, SOUL.md, config) across restarts
      - neo-lite-data:/root/.hermes
      # Mount your .env file
      - ./.env:/root/.hermes/.env:ro
      # Mount parts directory for add-on skill packs
      - ./parts:/opt/hermes/parts:ro
      # Mount assets (avatar pack) so you can find them on your host filesystem
      - ./assets:/opt/neo-lite-assets:ro
    environment:
      - HERMES_HOME=/root/.hermes
      - TERM=xterm-256color
      # Pass AI name + voice from .env
      - NEO_AI_NAME=${NEO_AI_NAME}
      - NEO_AI_TONE=${NEO_AI_TONE}
    restart: unless-stopped
    # Resource limits — cap memory + CPU so the AI doesn't eat your whole machine.
    # Override in .env: NEO_MEM_LIMIT=4g / NEO_CPUS=2
    mem_limit: ${NEO_MEM_LIMIT:-1g}
    cpus: ${NEO_CPUS:-0.5}

volumes:
  neo-lite-data:
