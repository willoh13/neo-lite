# ──────────────────────────────────────────────────────────────────────────
# NEO Lite — Hermes Agent Configuration (Free Tier)
# ──────────────────────────────────────────────────────────────────────────
# Users add their own API keys via .env

agent:
  max_turns: 20
  task_completion_guidance: true
  tool_use_enforcement: auto
  verbose: false

approvals:
  mode: manual
  destructive_slash_confirm: true

auxiliary:
  vision:
    provider: auto
    timeout: 60
  compression:
    provider: auto
    timeout: 60

compression:
  enabled: true
  target_ratio: 0.2
  threshold: 0.5

cron:
  max_parallel_jobs: 0

curator:
  enabled: false

display:
  compact: true
  show_cost: false
  show_reasoning: false
  skin: default
  streaming: true
  final_response_markdown: strip

gateway:
  strict: false

memory:
  memory_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  user_profile_enabled: true

model:
  default: neo-lite-model
  provider: custom

custom_providers:
  # DeepSeek (default — cheapest, ~$0.50/mo for casual use)
  - name: neo-lite-model
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: "${DEEPSEEK_API_KEY}"

  # Ollama (local — free, private, default for ops + privacy tasks)
  - name: neo-ollama
    model: gemma4:e4b
    base_url: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
    api_key: "${OLLAMA_API_KEY:-ollama}"

  # OpenAI (GPT-4o, o3-mini, etc.)
  - name: neo-openai
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"

  # Anthropic (Claude Sonnet, Opus)
  - name: neo-anthropic
    model: claude-sonnet-4
    base_url: https://api.anthropic.com/v1
    api_key: "${ANTHROPIC_API_KEY}"

  # OpenRouter (200+ models through one API key)
  - name: neo-openrouter
    model: openai/gpt-4o
    base_url: https://openrouter.ai/api/v1
    api_key: "${OPENROUTER_API_KEY}"

  # Google Gemini
  - name: neo-google
    model: gemini/gemini-2.0-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key: "${GOOGLE_API_KEY}"

  # Groq (fast inference, generous free tier)
  - name: neo-groq
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key: "${GROQ_API_KEY}"

  # xAI Grok
  - name: neo-xai
    model: grok-2
    base_url: https://api.x.ai/v1
    api_key: "${XAI_API_KEY}"

security:
  tirith_enabled: true
  redact_secrets: true

skills:
  creation_nudge_interval: 15
  external_dirs: []
  guard_agent_created: true

terminal:
  backend: local
  timeout: 60

toolsets:
  - hermes-cli

platform_toolsets:
  telegram:
    - web
    - file
    - terminal
    - memory
    - session_search
    - todo
    - clarify
  web:
    backend: ddgs
    extract_backend: ""
    search_backend: ""
