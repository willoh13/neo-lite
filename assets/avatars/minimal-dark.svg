<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg2)"/>
  <!-- Outer thin ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1f2937" stroke-width="1"/>
  <!-- Main gradient ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring2)" stroke-width="6"/>
  <!-- Inner ring (dashed) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 8"/>
  <!-- Center monogram space -->
  <circle cx="256" cy="256" r="80" fill="#0a0a14"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#ring2)" stroke-width="2"/>
  <!-- Abstract AI mark (geometric) -->
  <g transform="translate(256, 256)" fill="none" stroke="url(#ring2)" stroke-width="4" stroke-linecap="round">
    <line x1="-30" y1="0" x2="30" y2="0"/>
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-21" y1="-21" x2="21" y2="21"/>
    <line x1="-21" y1="21" x2="21" y2="-21"/>
  </g>
</svg>
