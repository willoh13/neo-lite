    context_size: 2
    output_length: 4
    latency: 2
    cost_ceiling: 3
    privacy_locality: 0
    tool_use: 1
    code_quality: 0
    multimodal: 0
    factuality: 2
    language_fluency: 2
    rate_limit_pressure: 0
    auditability: 1
    brand_voice_match: 4  # MUST match Will's voice

  # NRO default — web research, trend spotting
