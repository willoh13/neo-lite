  soft_cap_usd: 0.50       # warn when exceeded
  hard_cap_usd: 2.00       # force local-only when exceeded
  reset_hour_utc: 0        # midnight UTC

# ─── Task-type presets ───────────────────────────────────────────────────────
# Pre-scored profiles for common task types. Saves re-scoring every time.
# These are what NEO sub-agents (NOO, NFO, NTO, NMO, NRO) use by default.

task_presets:
  # NOO default — routine ops checks (MUST be cheap, fast, ideally local)
  ops_health_check:
    reasoning_depth: 0   # don't need reasoning, just "is X running"
    context_size: 0
    output_length: 0
    latency: 2       # cron wakeup, no user waiting
    cost_ceiling: 3  # critical: free or bust
    privacy_locality: 2  # prefer local, not required
    tool_use: 2      # need to call health-check tools
    code_quality: 0
    multimodal: 0
    factuality: 1
    language_fluency: 0
    rate_limit_pressure: 0
    auditability: 1
    brand_voice_match: 0

  # NFO default — cost reporting, token accounting (privacy-sensitive)
  financial_audit:
    reasoning_depth: 2
    context_size: 1
    output_length: 1
    latency: 1
    cost_ceiling: 3
    privacy_locality: 3  # MUST be local (financial data)
    tool_use: 1
    code_quality: 1
    multimodal: 0
    factuality: 3
    language_fluency: 0
    rate_limit_pressure: 0
    auditability: 3
    brand_voice_match: 0

  # NTO default — model eval, tool vetting, deep research
