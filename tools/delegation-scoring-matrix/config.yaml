    cost_ceiling: 3
    privacy_locality: 0
    tool_use: 2
    code_quality: 3
    multimodal: 0
    factuality: 3
    language_fluency: 1
    rate_limit_pressure: 0
    auditability: 2
    brand_voice_match: 0

  # NMO default — content drafts, marketing copy
