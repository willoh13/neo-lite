# ─────────────────────────────────────────────────────────────────────────────
# NEO Delegation Scoring Matrix — Model Routing Config
# ─────────────────────────────────────────────────────────────────────────────
# Edit this file to tune how NEO picks a model for each task.
# No code changes required — just edit scores and weights, restart NEO.
#
# Scoring method (adapted from AIDA's framework, applied to model selection):
#   1. For each incoming task, score it 0–3 on each of 14 dimensions
#   2. Multiply by per-dimension weights (configured below)
#   3. For each candidate model, multiply its 0–4 capability scores by the same weights
#   4. Pick the model with the highest weighted score
#   5. Apply hard constraints first (privacy, cost ceiling, latency) — if violated, skip
#
# Score legend:
#   3 = critical requirement, must be met
#   2 = important
#   1 = nice-to-have
#   0 = irrelevant for this task
# ─────────────────────────────────────────────────────────────────────────────

# ─── Per-dimension weights (how much each dimension matters overall) ──────────
# Higher weight = dimension has more impact on the final score.
# Tune these to reflect your cost/quality tradeoffs.

dimension_weights:
  reasoning_depth:        1.5   # Multi-step logic, planning, debugging
  context_size:           1.0   # Large inputs (>32k tokens)
  output_length:          0.8   # Long-form generation (scripts, threads)
  latency:                1.2   # User is waiting interactively
  cost_ceiling:           2.0   # Hard $/task budget (bumped: cost matters)
  privacy_locality:       1.0   # Must NOT leave the machine
  tool_use:               1.0   # Function calling / structured output
  code_quality:           1.2   # Programming tasks
  multimodal:             0.8   # Vision/audio input
  factuality:             1.3   # Low hallucination tolerance
  language_fluency:       0.6   # Non-English output
  rate_limit_pressure:    0.8   # Many parallel calls expected
  auditability:           0.7   # Needs to be reproducible
  brand_voice_match:      1.5   # Must match existing content style (bumped: voice is non-negotiable for content)

# ─── Hard constraints (skip models that fail any of these) ──────────────────

hard_constraints:
  # Privacy: if task.privacy_locality = 3, only allow local models
  block_remote_when_local_required: true
  # Cost: if task would cost more than this $ for the model, skip it
  max_cost_per_task_usd: 0.50
  # Latency: if task needs response in <N seconds, exclude models slower than that
  max_latency_seconds: 60
  # Context: if task input exceeds model's max context, skip it
  # (per-model context limits are listed below)

# ─── Tie-breakers (when two models have similar scores) ──────────────────────

tie_breakers:
  - prefer_cheaper          # Lower $/1k tokens wins
  - prefer_local            # Local > cloud if equal
  - prefer_lower_latency    # Faster response wins

# ─── Model registry ──────────────────────────────────────────────────────────
# Each model has:
#   - id: how to call it (provider/model format for OpenRouter, or ollama tag)
#   - tier: 1=cheapest, 5=most-capable (for ordering in explain output)
#   - cost_per_1k_tokens: {input, output} in USD
#   - max_context_tokens: hard ceiling
#   - avg_latency_seconds: typical p50
#   - capabilities: 0–4 score on each of the 14 dimensions
#      0 = can't do it
#      1 = poor
#      2 = adequate
#      3 = good
#      4 = excellent
#   - availability: local | cloud | hybrid
#   - notes: when to use this model

